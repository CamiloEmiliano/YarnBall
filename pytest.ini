[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: Tier 1 fast in-memory unit tests (default)
    integration: Tier 2 multi-subsystem contract and pipeline integration tests
    e2e: Tier 3 live end-to-end system tests with graph database and LLM
filterwarnings =
    ignore::DeprecationWarning

