# ------------------------------------------------------------------------------
# YarnBall Financial GraphRAG Deployable Topology (ADR-00036)
# - Memgraph runs purely in-memory (no persistent volume) and is hydrated
#   deterministically from durable PostgreSQL `kg_nodes` / `kg_edges` on boot.
# - Dead `scraper` (`ingest.scraping_worker`) service removed per ADR-00036 &
#   data_sources policy.
# ------------------------------------------------------------------------------
services:
  memgraph:
    image: memgraph/memgraph-mage:latest
    container_name: memgraph
    ports:
      - "${MEMGRAPH_PORT:-7687}:7687"
    environment:
      - MEMGRAPH_ENABLE_UI=1
      - MEMGRAPH_USER=${MEMGRAPH_USER}
      - MEMGRAPH_PASSWORD=${MEMGRAPH_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/7687 && exec 3<&- && exec 3>&- || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # Memgraph Lab (UI) service
  memgraph_lab:
    image: memgraph/lab:latest
    container_name: memgraph_lab
    ports:
      - "${MEMGRAPH_UI_PORT:-3000}:3000"
    environment:
      - QUICK_CONNECT_MG_HOST=memgraph
      - QUICK_CONNECT_MG_PORT=7687
    depends_on:
      memgraph:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: graphrag_pg
    restart: unless-stopped
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    env_file: .env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: financial_rag
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Kafka service (KRaft mode, no Zookeeper)
  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    healthcheck:
      test: ["CMD-SHELL", "/bin/kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # One-shot sidecar service that runs PostgreSQL schema initialisation once
  db_init:
    build:
      context: .
      dockerfile: Dockerfile
    image: graphrag_finance:latest
    container_name: graphrag_db_init
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "tools.init_db"]
    restart: "no"
    mem_limit: 1g

  # One-shot startup hydrator that rebuilds ephemeral Memgraph RAM from Postgres ledger (ADR-00036)
  memgraph_hydrator:
    build:
      context: .
      dockerfile: Dockerfile
    image: graphrag_finance:latest
    container_name: graphrag_memgraph_hydrator
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      db_init:
        condition: service_completed_successfully
      memgraph:
        condition: service_healthy
    command: ["python", "-m", "tools.hydrate_memgraph"]
    restart: "no"
    mem_limit: 1g

  # Scheduler service that periodically runs Finnhub live streaming ingestion via APScheduler
  finnhub_scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    image: graphrag_finance:latest
    container_name: graphrag_scheduler
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      db_init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      FINANCIAL_RAG_DB: ${FINANCIAL_RAG_DB}
    command: ["python", "-m", "tools.scheduler"]

  # Kafka consumer persisting raw financial news & embeddings into PostgreSQL
  stream_consumer:
    build:
      context: .
      dockerfile: Dockerfile
    image: graphrag_finance:latest
    container_name: graphrag_stream_consumer
    restart: unless-stopped
    env_file: .env
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      db_init:
        condition: service_completed_successfully
    command: ["python", "-m", "streaming.consumer"]

  # Kafka consumer committing extracted assertions to Postgres kg_nodes/kg_edges then Memgraph RAM
  memgraph_consumer:
    build:
      context: .
      dockerfile: Dockerfile
    image: graphrag_finance:latest
    container_name: graphrag_memgraph_consumer
    restart: unless-stopped
    env_file: .env
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      db_init:
        condition: service_completed_successfully
      memgraph:
        condition: service_healthy
      memgraph_hydrator:
        condition: service_completed_successfully
    command: ["python", "-m", "knowledge_graph.memgraph_consumer"]

  # Consolidated BI Retrieval FastAPI service (ADR-00034 / ADR-00036)
  retriever:
    build:
      context: .
      dockerfile: retrieval/Dockerfile
    image: graphrag_retriever:latest
    container_name: graphrag_retriever
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      memgraph:
        condition: service_healthy
      memgraph_hydrator:
        condition: service_completed_successfully
    ports:
      - "8000:8000"

volumes:
  pgdata:
