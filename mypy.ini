[mypy]
python_version = 3.13
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
follow_imports = silent
show_error_codes = true

# Strict type checking on core modern GraphRAG and pipeline modules
[mypy-retrieval.guardrails.*]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[mypy-retrieval.temporal.*]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[mypy-retrieval.pipeline.*]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[mypy-sft_pipeline.serving.*]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[mypy-sft_pipeline.rejection_queue.*]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[mypy-ontology.guardrails.*]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[mypy-ingestion.segmentation.*]
disallow_untyped_defs = true
disallow_incomplete_defs = true
