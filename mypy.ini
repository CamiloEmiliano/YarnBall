[mypy]
python_version = 3.13
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
follow_imports = silent
show_error_codes = true

# Project-wide packages checked
files = curation, ingestion, knowledge_graph, ontology, retrieval, sft_pipeline, synthesis, universe, tools

# Strict type checking across core operational subsystems
[mypy-retrieval.*]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[mypy-sft_pipeline.*]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[mypy-ontology.*]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[mypy-curation.*]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[mypy-universe.*]
disallow_untyped_defs = true
disallow_incomplete_defs = true
